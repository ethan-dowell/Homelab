---
# Hosts here must match what Terraform assigned. After `terraform apply`, check
# with:  terraform -chdir=../terraform/docker-host output ansible_inventory_hint

all:
  children:
    docker_hosts:
      hosts:
        docker-01:
          ansible_host: 192.168.0.210
      vars:
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/homelab_ed25519
        ansible_become: true
        ansible_become_method: sudo
