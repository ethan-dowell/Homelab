---
- name: Set the system timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - htop
      - unattended-upgrades
      # Lets Proxmox report the guest's IP and shut it down gracefully. The
      # generic cloud image does not ship it, which is why Terraform leaves the
      # agent disabled until this role has run.
      - qemu-guest-agent
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check whether the host exposes the guest-agent virtio port
  ansible.builtin.stat:
    path: /dev/virtio-ports/org.qemu.guest_agent.0
  register: qga_port

# qemu-guest-agent.service hard-depends on that device node, so starting it
# without the port fails the systemd dependency job outright. Terraform builds
# the VM with agent.enabled = false (the generic cloud image has no agent, and
# enabling it up front makes Terraform block waiting for a reply that cannot
# come), which means the port only appears after vm_enable_qemu_agent is turned
# on and the VM restarted. Enable the unit either way so it starts on the next
# boot once the port is there.
- name: Enable the QEMU guest agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: "{{ 'started' if qga_port.stat.exists else omit }}"

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
