---
# Addresses here must match what Terraform assigned. After an apply, check with:
#   terraform -chdir=../terraform/<root> output ansible_inventory_hint

all:
  vars:
    ansible_user: ansible
    ansible_ssh_private_key_file: ~/.ssh/homelab_ed25519
    ansible_become: true
    ansible_become_method: sudo

  children:
    # VM 101 - Discord music bot
    docker_hosts:
      hosts:
        docker-01:
          ansible_host: 192.168.0.210

    # VM 102 - Pi-hole. Separate from docker-01 because DNS is the highest
    # blast-radius service here: if it stops answering, every device on the
    # network looks broken to everyone in the house.
    dns_hosts:
      hosts:
        dns-01:
          ansible_host: 192.168.0.211
