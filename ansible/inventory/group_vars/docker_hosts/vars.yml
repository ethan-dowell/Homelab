---
# Non-secret configuration. Secrets live next door in secrets.sops.yaml.
# `timezone` is shared and now lives in group_vars/all/vars.yml.

# --- discord_music_bot role -------------------------------------------------
dmb_repo_url: https://github.com/ethan-dowell/discord-music-bot.git
dmb_repo_version: main

dmb_install_dir: /opt/discord-music-bot
dmb_container_name: discord-music-bot
dmb_image_name: discord-music-bot:local

# Must match the botuser uid/gid baked into the bot repo's Dockerfile. The
# token file on the host is owned by this id so the unprivileged container user
# can read the bind-mounted secret.
dmb_container_uid: 10001

# Bot behaviour. These become environment variables in the container; see
# .env.example in the bot repo for the full list.
dmb_command_prefix: "!"
dmb_default_volume: 60
dmb_log_level: INFO
dmb_max_queue_length: 500
dmb_idle_timeout: 300
dmb_alone_timeout: 60

# Leave empty for a global slash-command sync. Set to a server ID during
# development so command changes appear immediately.
dmb_dev_guild_id: ""

# Container resource ceiling.
dmb_cpu_limit: "2.0"
dmb_memory_limit: 1G

# --- bot_autoupdate role ----------------------------------------------------
# Weekly image rebuild so the deployed yt-dlp does not drift behind upstream.
dmb_autoupdate_enabled: true
dmb_update_unit: discord-music-bot-update
# systemd calendar event. Sunday 04:00 keeps clear of the 02:30 Proxmox backup.
dmb_update_schedule: "Sun *-*-* 04:00:00"
dmb_update_random_delay: 1800
dmb_update_timeout: 1800
