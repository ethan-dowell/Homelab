[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
collections_path     = collections
interpreter_python   = auto_silent
stdout_callback      = yaml
retry_files_enabled  = False
forks                = 10

# Decrypt *.sops.yaml in group_vars/host_vars automatically. Requires the
# community.sops collection (see requirements.yml).
vars_plugins_enabled = host_group_vars,community.sops.sops

# The Docker host is disposable and gets rebuilt with a new host key each time
# Terraform recreates it, which would otherwise wedge every run.
host_key_checking    = False

[ssh_connection]
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
