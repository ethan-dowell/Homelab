---
- name: Provision the Docker host and deploy the Discord music bot
  hosts: docker_hosts
  become: true

  pre_tasks:
    - name: Wait for the host to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - common
    - docker
    - discord_music_bot

  post_tasks:
    - name: Show container status
      ansible.builtin.command:
        cmd: docker ps --filter name={{ dmb_container_name }} --format "{{ '{{.Names}}\t{{.Status}}' }}"
      register: dmb_status
      changed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ dmb_status.stdout_lines }}"
